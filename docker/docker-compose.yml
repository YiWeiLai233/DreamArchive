services:
  # ===== MySQL =====
  mysql:
    image: mysql:8.0
    container_name: dream-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: dream
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ../sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - dream-net

  # ===== Redis =====
  redis:
    image: redis:7-alpine
    container_name: dream-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dream-net

  # ===== MinIO 对象存储 =====
  minio:
    image: minio/minio:latest
    container_name: dream-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dream-net

  # ===== 后端 (Spring Boot) =====
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: dream-backend
    restart: unless-stopped
    environment:
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      AUTH_SECRET: ${AUTH_SECRET}
      AI_API_KEY: ${AI_API_KEY}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/hello"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - dream-net

  # ===== 前端 (Nginx) =====
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: dream-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dream-net

volumes:
  mysql-data:
  redis-data:
  minio-data:

networks:
  dream-net:
    driver: bridge

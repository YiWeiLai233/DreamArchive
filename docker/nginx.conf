# DreamArchive Nginx 配置
# 前端静态文件 + API 反向代理

# 限流区域
limit_req_zone $binary_remote_addr zone=dream_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=dream_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=dream_guest_ai:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=dream_upload:10m rate=30r/m;

server {
    listen 80;
    server_name _;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # 请求体大小限制
    client_max_body_size 10m;

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    # 静态资源缓存（7天）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 登录/注册/重置密码接口 — 严格限流
    location ~ ^/api/(login|register|reset-password|change-password) {
        limit_req zone=dream_auth burst=5 nodelay;

        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }

    # 游客 AI 接口 — 限流
    location /api/guest/ {
        limit_req zone=dream_guest_ai burst=3 nodelay;

        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }

    # 图片上传接口 — 专用限流
    location = /api/upload/image {
        limit_req zone=dream_upload burst=10 nodelay;
        client_max_body_size 6m;

        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # API 代理 — 通用限流
    location /api/ {
        limit_req zone=dream_general burst=30 nodelay;

        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }

    # Swagger UI — 生产环境建议注释掉或限制内网访问
    # location /swagger-ui/ {
    #     allow 127.0.0.1;
    #     deny all;
    #     proxy_pass http://backend:8080;
    #     proxy_set_header Host $host;
    # }

    # Vue Router history 模式
    location / {
        try_files $uri $uri/ /index.html;
    }
}

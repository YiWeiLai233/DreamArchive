# Docker 环境专用配置
# 敏感信息通过环境变量注入
# ===== 服务器 =====
server.port=8080
server.address=0.0.0.0

# ===== MySQL =====
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://mysql:3306/dream?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# ===== MyBatis =====
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# ===== Redis =====
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.password=${REDIS_PASSWORD}

# ===== MinIO =====
minio.endpoint=http://minio:9000
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket=dream-archive

# ===== 邮件 =====
spring.mail.host=smtp.qq.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ===== 认证 =====
app.auth.secret=${AUTH_SECRET}
app.auth.ttl-seconds=86400
app.auth.cookie-secure=false
app.auth.cookie-domain=
app.auth.cookie-same-site=Lax
# ===== 文件上传 =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ===== CORS =====
# 同源部署时 Nginx 代理前端和后端，CORS 不生效；跨域部署时填写前端域名/IP
app.cors.allowed-origin-patterns=http://localhost,http://127.0.0.1
app.cors.allowed-methods=GET,POST,OPTIONS
app.cors.allowed-headers=Content-Type,Authorization,X-Requested-With,X-XSRF-TOKEN
app.cors.exposed-headers=X-XSRF-TOKEN
app.cors.allow-credentials=true
app.cors.max-age=3600

# ===== AI 资源池 =====
ai.pool.heartbeat.enabled=true
ai.pool.heartbeat.timeout-seconds=10
# ===== 限流 =====
app.security.rate-limit.enabled=true
app.security.rate-limit.login-failure-ip-max=20
app.security.rate-limit.login-failure-identifier-max=5
app.security.rate-limit.login-failure-ip-identifier-max=5
app.security.rate-limit.login-failure-window-seconds=900

app.security.rate-limit.verification-send-ip-max=10
app.security.rate-limit.verification-send-ip-window-seconds=600
app.security.rate-limit.verification-failure-ip-max=30
app.security.rate-limit.verification-failure-identifier-max=5
app.security.rate-limit.verification-failure-ip-identifier-max=5
app.security.rate-limit.verification-failure-window-seconds=300
app.security.rate-limit.guest-analyze-ip-max=20
app.security.rate-limit.guest-analyze-ip-window-seconds=86400

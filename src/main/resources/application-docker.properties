# Docker 环境专用配置
# 敏感信息通过环境变量注入

# ===== 服务器 =====
server.port=8080
server.address=0.0.0.0

# ===== MySQL =====
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://mysql:3306/dream?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8mb4
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# ===== MyBatis =====
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# ===== Redis =====
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.database=0

# ===== MinIO =====
minio.endpoint=http://minio:9000
minio.access-key=${MINIO_ROOT_USER}
minio.secret-key=${MINIO_ROOT_PASSWORD}
minio.bucket=dream-archive

# ===== 邮件 =====
spring.mail.host=smtp.qq.com
spring.mail.port=587
spring.mail.username=859399899@qq.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ===== 认证 =====
app.auth.secret=${AUTH_SECRET}
app.auth.token-ttl-seconds=86400
app.auth.cookie-secure=false
app.auth.cookie-domain=
app.auth.cookie-same-site=Lax

# ===== 文件上传 =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ===== CORS =====
# 同源部署时 Nginx 代理前端和后端，CORS 不生效；跨域部署时填写前端域名/IP
app.cors.allowed-origin-patterns=http://localhost,http://127.0.0.1
app.cors.allowed-methods=GET,POST,OPTIONS
app.cors.allowed-headers=Content-Type,Authorization,X-Requested-With,X-XSRF-TOKEN
app.cors.exposed-headers=X-XSRF-TOKEN
app.cors.allow-credentials=true
app.cors.max-age=3600

# ===== AI 资源池 =====
ai.pool.providers[0].name=mimo
ai.pool.providers[0].url=https://token-plan-cn.xiaomimimo.com/v1
ai.pool.providers[0].apiKey=${AI_API_KEY}
ai.pool.providers[0].model=mimo-v2.5-pro
ai.pool.providers[0].weight=50
ai.pool.providers[0].enabled=true

ai.pool.providers[1].name=mimo2
ai.pool.providers[1].url=https://token-plan-cn.xiaomimimo.com/v1
ai.pool.providers[1].apiKey=${AI_API_KEY}
ai.pool.providers[1].model=mimo-v2.5
ai.pool.providers[1].weight=60
ai.pool.providers[1].enabled=true

ai.pool.vision-provider=mimo2
ai.pool.heartbeat.enabled=true
ai.pool.heartbeat.timeout=10000

# ===== 限流 =====
rate-limit.enabled=true
rate-limit.login.max-attempts=5
rate-limit.login.window-seconds=300
rate-limit.verification.max-attempts=3
rate-limit.verification.window-seconds=60
rate-limit.guest-ai.max-attempts=10
rate-limit.guest-ai.window-seconds=60

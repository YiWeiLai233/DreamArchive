spring.application.name=DreamArchive
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dream?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis.type-aliases-package=com.yiweilai.DreamArchive.DTO.Dream
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
ai.api.url=${AI_API_URL:}
ai.api.key=${AI_API_KEY:}
ai.api.model=${AI_API_MODEL:}
